<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YOLOapply</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">Y</div>
      <div>
        <strong>YOLOapply</strong>
        <small data-role="conn">checking…</small>
      </div>
    </div>
    <div class="head-right">
      <button class="icon" data-act="toggle-shortcuts" title="Toggle keyboard shortcuts (?)">⌨</button>
      <button class="icon" data-act="settings" title="Settings">⚙</button>
    </div>
  </header>

  <section class="actions">
    <button class="primary" data-act="save" data-key="s">Save current job <kbd>S</kbd></button>
    <button class="secondary" data-act="fill" data-key="f">Auto-fill form <kbd>F</kbd></button>
    <button class="secondary" data-act="answer" data-key="a">Answer open-ended Qs <kbd>A</kbd></button>
    <button class="secondary" data-act="cover" data-key="c">Cover letter <kbd>C</kbd></button>
    <button class="secondary" data-act="resume" data-key="r">Upload resume <kbd>R</kbd></button>
    <button class="secondary" data-act="personalize" data-key="p">Personalize resume <kbd>P</kbd></button>
    <button class="link" data-act="dashboard" data-key="d">Open dashboard ↗ <kbd>D</kbd></button>
  </section>

  <div class="status hidden" data-role="status"></div>

  <section class="qa">
    <div class="qa-head">
      <h3>Answer a question</h3>
      <button class="link" data-act="qa-clear" title="Clear history">clear all</button>
    </div>
    <textarea data-role="qa-input" rows="3" placeholder="Paste an open-ended application question here…"></textarea>
    <label class="qa-ctx">
      <input type="checkbox" data-role="qa-usepage" checked />
      <span>Use the current tab as job context</span>
    </label>
    <button class="primary" data-act="qa-generate">Generate answer <kbd>Ctrl ↵</kbd></button>
    <ul class="qa-list" data-role="qa-list"></ul>
  </section>

  <div class="shortcut-hint" data-role="shortcut-hint">
    Press a highlighted key to run an action. <kbd>?</kbd> toggles these hints.
  </div>

  <section class="recent">
    <h3>Recent applications</h3>
    <ul data-role="apps"><li class="muted">Loading…</li></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
