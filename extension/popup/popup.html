<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YOLOapply</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">Y</div>
      <div>
        <strong>YOLOapply</strong>
        <small data-role="conn">checking…</small>
      </div>
    </div>
    <button class="icon" data-act="settings" title="Settings">⚙</button>
  </header>

  <section class="actions">
    <button class="primary" data-act="save">Save current job</button>
    <button class="secondary" data-act="fill">Auto-fill form</button>
    <button class="secondary" data-act="answer">Answer open-ended Qs</button>
    <button class="secondary" data-act="cover">Cover letter</button>
    <button class="secondary" data-act="resume">Upload resume</button>
    <button class="secondary" data-act="personalize" disabled>Personalize resume</button>
    <button class="link" data-act="dashboard">Open dashboard ↗</button>
  </section>

  <div class="status hidden" data-role="status"></div>

  <section class="qa">
    <div class="qa-head">
      <h3>Answer a question</h3>
      <button class="link" data-act="qa-clear" title="Clear history">clear all</button>
    </div>
    <textarea data-role="qa-input" rows="3" placeholder="Paste an open-ended application question here…"></textarea>
    <label class="qa-ctx">
      <input type="checkbox" data-role="qa-usepage" checked />
      <span>Use the current tab as job context</span>
    </label>
    <button class="primary" data-act="qa-generate">Generate answer</button>
    <ul class="qa-list" data-role="qa-list"></ul>
  </section>

  <section class="recent">
    <h3>Recent applications</h3>
    <ul data-role="apps"><li class="muted">Loading…</li></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
