<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YOLOapply — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>YOLOapply Settings</h1>
    <p class="muted">The extension talks to your local backend. Set the URL and the shared API key.</p>

    <label>
      <span>Backend URL</span>
      <input type="url" data-field="apiBase" placeholder="http://localhost:3001" />
      <small class="muted">Your Next.js app — usually <code>http://localhost:3001</code> while developing.</small>
    </label>

    <label>
      <span>API key</span>
      <input type="text" data-field="apiKey" placeholder="paste from .env: EXTENSION_API_KEY" />
      <small class="muted">Set <code>EXTENSION_API_KEY</code> in <code>.env</code> and paste the same value here.</small>
    </label>

    <label class="check">
      <input type="checkbox" data-field="autoDetectJob" />
      <span>Auto-mount the widget on detected job pages</span>
    </label>

    <label class="check">
      <input type="checkbox" data-field="showWidget" />
      <span>Show floating widget popup on pages</span>
    </label>

    <div class="actions">
      <button class="primary" data-act="save">Save</button>
      <button class="secondary" data-act="test">Test connection</button>
    </div>

    <div class="status hidden" data-role="status"></div>

    <div class="shortcuts-note">
      <strong>Keyboard shortcuts</strong>
      <ul>
        <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd> — show / hide the on-page widget</li>
        <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> — open the popup</li>
      </ul>
      <small class="muted">Rebind these at <code>chrome://extensions/shortcuts</code>.</small>
    </div>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
